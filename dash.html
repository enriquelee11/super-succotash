<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Pulse Dash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cabinet: #141225;
    --cabinet-hi: #241f42;
    --cabinet-lo: #0a0916;
    --screen: #0a0b18;
    --screen-edge: #050510;
    --neon: #35f0ff;
    --neon-bright: #c8fdff;
    --neon-dim: #1c6b78;
    --danger: #ff2d6a;
    --text-hint: #8f8ad0;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--cabinet-lo);
    color: var(--neon);
    font-family: 'Space Mono', 'Courier New', monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .display-font { font-family: 'Press Start 2P', 'Courier New', monospace; }

  @media (prefers-reduced-motion: no-preference) {
    .flicker { animation: flicker 6s infinite; }
  }
  @keyframes flicker {
    0%, 93%, 100% { opacity: 1; }
    94% { opacity: 0.94; }
    95% { opacity: 1; }
    96% { opacity: 0.9; }
    97% { opacity: 1; }
  }

  .cabinet {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    padding: 22px 26px 28px;
    background: linear-gradient(155deg, var(--cabinet-hi) 0%, var(--cabinet) 40%, var(--cabinet-lo) 100%);
    border-radius: 18px;
    box-shadow:
      0 0 0 2px var(--cabinet-lo),
      0 18px 50px rgba(0,0,0,0.65),
      inset 0 2px 0 rgba(255,255,255,0.04);
  }

  .marquee {
    text-align: center;
    font-size: 15px;
    letter-spacing: 3px;
    color: var(--cabinet-lo);
    background: linear-gradient(180deg, var(--neon-bright), var(--neon) 70%);
    padding: 10px 22px;
    border-radius: 6px;
    box-shadow: 0 2px 0 rgba(0,0,0,0.4), 0 0 22px rgba(53,240,255,0.35);
  }

  .hud {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    max-width: 640px;
    font-size: 11px;
    letter-spacing: 1px;
    color: var(--neon-dim);
    padding: 0 2px;
    gap: 8px;
    flex-wrap: wrap;
  }
  .hud b { color: var(--neon-bright); font-weight: 700; text-shadow: 0 0 6px rgba(200,253,255,0.6); }
  .hud-level { display: flex; align-items: center; gap: 6px; }
  .hud-dot { width: 8px; height: 8px; border-radius: 50%; box-shadow: 0 0 6px currentColor; background: currentColor; flex: none; }
  .menu-btn {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 1px;
    color: var(--neon-dim);
    background: transparent;
    border: 1px solid rgba(53,240,255,0.25);
    border-radius: 4px;
    padding: 3px 8px;
    cursor: pointer;
    box-shadow: none;
  }
  .menu-btn:hover { color: var(--neon-bright); border-color: var(--neon); filter: none; }
  .menu-btn:active { transform: none; box-shadow: none; }

  .progress-wrap {
    width: 100%;
    max-width: 640px;
    height: 8px;
    background: rgba(53,240,255,0.08);
    border-radius: 4px;
    overflow: hidden;
    box-shadow: inset 0 0 0 1px rgba(53,240,255,0.15);
  }
  .progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--neon-dim), var(--neon-bright));
    box-shadow: 0 0 10px rgba(53,240,255,0.6);
    transition: width 0.05s linear;
  }

  .screen-frame {
    position: relative;
    border-radius: 10px;
    padding: 14px;
    background: var(--screen-edge);
    box-shadow: inset 0 0 0 1px rgba(53,240,255,0.08);
  }
  .board-wrap {
    position: relative;
    border-radius: 4px;
    overflow: hidden;
    background: var(--screen);
    box-shadow: inset 0 0 60px rgba(0,0,0,0.85), inset 0 0 2px rgba(53,240,255,0.4);
  }
  .board-wrap::after {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(to bottom, rgba(0,0,0,0.22) 0px, rgba(0,0,0,0.22) 1px, transparent 2px, transparent 3px);
    mix-blend-mode: multiply;
  }
  .board-wrap::before {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.55) 100%);
    z-index: 3;
  }
  canvas {
    display: block;
    background: var(--screen);
    position: relative;
    z-index: 1;
    touch-action: none;
    cursor: pointer;
  }

  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    text-align: center;
    padding: 20px;
    z-index: 4;
  }
  .overlay .panel {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    background: rgba(6, 6, 16, 0.85);
    border-radius: 12px;
    padding: 22px 26px;
    box-shadow: 0 0 40px rgba(0,0,0,0.6), inset 0 0 0 1px rgba(53,240,255,0.1);
  }
  #overOverlay, #winOverlay { background: rgba(6, 6, 16, 0.4); }
  .overlay h2 {
    margin: 0;
    font-size: 17px;
    line-height: 1.6;
    color: var(--neon-bright);
    text-shadow: 0 0 14px rgba(200,253,255,0.7);
  }
  .overlay p { margin: 0; color: var(--text-hint); font-size: 11.5px; line-height: 1.9; max-width: 360px; }
  .overlay .danger { color: var(--danger); text-shadow: 0 0 14px rgba(255,45,106,0.7); }

  .menu-panel { width: 100%; max-width: 380px; }
  .level-list { display: flex; flex-direction: column; gap: 8px; width: 100%; }
  .level-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    width: 100%;
    text-align: left;
    background: rgba(255,255,255,0.03);
    border: none;
    border-left: 4px solid var(--card-color, var(--neon));
    border-radius: 6px;
    padding: 10px 12px;
    cursor: pointer;
    box-shadow: none;
    transition: background 0.12s ease, transform 0.08s ease;
  }
  .level-card:hover { background: rgba(255,255,255,0.08); filter: none; }
  .level-card:active { transform: translateY(1px); box-shadow: none; }
  .level-card:focus-visible { outline: 2px solid var(--card-color, var(--neon)); outline-offset: 2px; }
  .level-card-name { font-family: 'Press Start 2P', monospace; font-size: 10px; color: var(--neon-bright); letter-spacing: 0.5px; }
  .level-card-diff { font-size: 9px; letter-spacing: 1.5px; color: var(--card-color, var(--neon)); margin-top: 4px; }
  .level-card-best { font-size: 10px; color: var(--text-hint); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .menu-hint { color: var(--text-hint); font-size: 10px; letter-spacing: 0.5px; margin-top: 2px; }

  button {
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 2px;
    background: linear-gradient(180deg, var(--neon-bright), var(--neon) 75%);
    color: #071018;
    border: none;
    padding: 12px 26px;
    border-radius: 5px;
    cursor: pointer;
    box-shadow: 0 3px 0 #0d5460, 0 0 18px rgba(53,240,255,0.3);
    transition: transform 0.08s ease, box-shadow 0.08s ease;
  }
  button:hover { filter: brightness(1.08); }
  button:active { transform: translateY(3px); box-shadow: 0 0 0 #0d5460, 0 0 10px rgba(53,240,255,0.3); }
  button:focus-visible { outline: 2px solid var(--neon-bright); outline-offset: 3px; }

  .hint {
    color: var(--text-hint);
    font-size: 10px;
    letter-spacing: 0.5px;
    text-align: center;
    max-width: 640px;
    line-height: 1.7;
  }
  .hint a { color: var(--neon); }
  .hidden { display: none !important; }

  .tap-btn {
    display: none;
    width: 100%;
    max-width: 640px;
    padding: 16px;
    font-size: 14px;
    border-radius: 10px;
  }
  @media (pointer: coarse) {
    .tap-btn { display: block; }
  }
</style>
</head>
<body>
  <div class="cabinet flicker">
    <div class="marquee display-font">PULSE DASH</div>
    <div class="hud">
      <button class="menu-btn" id="menuBtn">&#9776; MENU</button>
      <span class="hud-level"><span class="hud-dot" id="hudDot"></span><b id="levelLabel">&mdash;</b></span>
      <span>MODE <b id="modeLabel">CUBE</b></span>
      <span>ATTEMPT <b id="attempts">1</b></span>
      <span>BEST <b id="best">0%</b></span>
    </div>
    <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
    <div class="screen-frame">
      <div class="board-wrap">
        <canvas id="board" width="640" height="360"></canvas>
        <div id="menuOverlay" class="overlay">
          <div class="panel menu-panel">
            <h2 class="display-font">SELECT LEVEL</h2>
            <div class="level-list" id="levelList"></div>
            <div class="menu-hint">TAP A LEVEL TO START &nbsp;·&nbsp; ONE BUTTON: TAP / CLICK / SPACE<br/>HOLD FOR SHIP, WAVE &amp; ROBOT MODES</div>
          </div>
        </div>
        <div id="overOverlay" class="overlay hidden">
          <div class="panel">
            <h2 class="display-font danger">CRASHED</h2>
            <p id="crashInfo">0%</p>
            <button id="crashMenuBtn">MENU</button>
          </div>
        </div>
        <div id="winOverlay" class="overlay hidden">
          <div class="panel">
            <h2 class="display-font">LEVEL<br/>CLEAR</h2>
            <p id="winInfo"></p>
            <div style="display:flex; gap:10px;">
              <button id="againBtn">PLAY AGAIN</button>
              <button id="winMenuBtn">MENU</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="hint">EVERY OBSTACLE AND PORTAL IS TIMED TO THE MUSIC &nbsp;·&nbsp; HIT ANYTHING AND YOU RESTART &nbsp;·&nbsp; <a href="index.html">&larr; AMBER SNAKE</a></div>
    <button class="tap-btn" id="tapBtn">TAP</button>
  </div>

<script>
(() => {
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  const attemptsEl = document.getElementById('attempts');
  const modeLabelEl = document.getElementById('modeLabel');
  const levelLabelEl = document.getElementById('levelLabel');
  const hudDotEl = document.getElementById('hudDot');
  const bestEl = document.getElementById('best');
  const progressBar = document.getElementById('progressBar');
  const menuOverlay = document.getElementById('menuOverlay');
  const overOverlay = document.getElementById('overOverlay');
  const winOverlay = document.getElementById('winOverlay');
  const crashInfo = document.getElementById('crashInfo');
  const winInfo = document.getElementById('winInfo');
  const levelListEl = document.getElementById('levelList');

  // ---------- Timing / world constants ----------
  const SCROLL_SPEED = 300; // px/sec, constant across levels — difficulty scales via BPM & density
  const GROUND_Y = 300;
  const CEIL_Y = 50;
  const PLAYER_X = 150;
  const MID_Y = (GROUND_Y + CEIL_Y) / 2;

  // per-level, set by loadLevel()
  let BPM, BEAT, GRID, LEVEL_BEATS, LEVEL_WORLD_LEN, SIXTEENTH;

  const MODE_COLORS = {
    cube: '#35f0ff', ship: '#4dff8a', ball: '#ffe14d',
    ufo: '#ff5fd1', wave: '#5f9bff', robot: '#c07bff', spider: '#ffffff',
  };

  // ---------- Level authoring ----------
  function spike(beat, side) { return { beat, kind: 'spike', side }; }
  function block(beat, side, depth) { return { beat, kind: 'block', side, depth }; }
  function pad(beat) { return { beat, kind: 'pad' }; }
  function portal(beat, mode) { return { beat, kind: 'portal', mode }; }
  function finish(beat) { return { beat, kind: 'finish' }; }
  function scaleBeats(events, factor) {
    return events.map(e => ({ ...e, beat: Math.round(e.beat * factor * 1000) / 1000 }));
  }

  // EASY — gentle intro, generous spacing, only the simplest modes
  const EASY_EVENTS = [
    spike(4, 'floor'), spike(7, 'floor'), spike(10, 'floor'),
    pad(13),
    portal(14, 'ship'),
    block(17, 'floor', 90), block(20, 'ceil', 90), block(23, 'floor', 90),
    portal(26, 'ball'),
    spike(29, 'floor'), spike(32, 'ceil'), spike(35, 'floor'),
    portal(38, 'ufo'),
    spike(41, 'floor'), spike(44, 'floor'), spike(47, 'floor'),
    portal(50, 'cube'),
    spike(53, 'floor'), spike(56, 'floor'),
    finish(60),
  ];

  // MEDIUM — the original Pulse Dash tour through all seven modes (bot-verified end to end)
  const MEDIUM_EVENTS = [
    spike(4, 'floor'), spike(6, 'floor'), spike(8, 'floor'), spike(10, 'floor'),
    spike(12, 'floor'), spike(12.5, 'floor'), spike(14, 'floor'),
    pad(15),
    portal(15.5, 'ship'),
    block(18, 'floor', 110), block(20, 'ceil', 110),
    block(22, 'floor', 130), block(24, 'ceil', 130),
    block(26, 'floor', 100), block(28, 'ceil', 150),
    block(30, 'floor', 120),
    portal(31.5, 'ball'),
    spike(34, 'floor'), spike(36, 'ceil'), spike(38, 'floor'), spike(40, 'ceil'),
    spike(42, 'floor'), spike(44, 'ceil'), spike(46, 'floor'),
    portal(47.5, 'ufo'),
    spike(50, 'floor'), spike(52, 'floor'), spike(54, 'floor'),
    spike(56, 'floor'), spike(56.5, 'floor'),
    spike(58, 'floor'), spike(60, 'floor'),
    spike(62, 'floor'), spike(62.5, 'floor'),
    portal(63.5, 'wave'),
    block(65, 'floor', 90), block(67, 'ceil', 90),
    block(69, 'floor', 100), block(71, 'ceil', 80),
    block(73, 'floor', 80), block(75, 'ceil', 100),
    block(77, 'floor', 90),
    portal(79.5, 'robot'),
    spike(81, 'floor'),
    spike(83, 'floor'), spike(83.4, 'floor'),
    spike(85, 'floor'), spike(85.3, 'floor'), spike(85.6, 'floor'),
    spike(87, 'floor'),
    portal(87.5, 'spider'),
    spike(89, 'floor'), spike(90.5, 'ceil'), spike(92, 'floor'),
    spike(93.5, 'ceil'), spike(95, 'floor'),
    finish(97),
  ];

  // HARD & INSANE reuse the medium pattern run twice, at a faster tempo. Jump/flip physics
  // are fixed in absolute time (not beats), so a higher BPM alone shrinks every gap's real
  // clearance — beat positions are stretched by a compensating factor to restore medium's
  // proven absolute-time safety margins before the tempo increase is applied.
  function buildTwoLapLevel(scale) {
    const base = scaleBeats(MEDIUM_EVENTS.filter(e => e.kind !== 'finish'), scale);
    const lapLen = 97 * scale;
    const events = [
      ...base,
      portal(lapLen + 1, 'cube'),
      ...base.map(e => ({ ...e, beat: +(e.beat + lapLen + 1).toFixed(3) })),
    ];
    return { events, totalBeats: Math.ceil(lapLen * 2 + 3) };
  }

  const hardLevel = buildTwoLapLevel(1.15);
  const HARD_EVENTS = [...hardLevel.events, finish(hardLevel.totalBeats)];

  const insaneLevel = buildTwoLapLevel(1.3);
  const INSANE_EVENTS = [...insaneLevel.events, finish(insaneLevel.totalBeats)];

  const LEVEL_DEFS = [
    { id: 'easy', name: 'WARM UP', difficulty: 'EASY', color: '#4dff8a', bpm: 120, totalBeats: 60, events: EASY_EVENTS },
    { id: 'medium', name: 'PULSE DASH', difficulty: 'MEDIUM', color: '#35f0ff', bpm: 150, totalBeats: 97, events: MEDIUM_EVENTS },
    { id: 'hard', name: 'OVERDRIVE', difficulty: 'HARD', color: '#ff9f35', bpm: 170, totalBeats: hardLevel.totalBeats, events: HARD_EVENTS },
    { id: 'insane', name: 'REDLINE', difficulty: 'INSANE', color: '#ff2d6a', bpm: 190, totalBeats: insaneLevel.totalBeats, events: INSANE_EVENTS },
  ];

  // Precompute each level's own grid/obstacle geometry once (independent of whichever level is "current")
  const LEVELS = LEVEL_DEFS.map(def => {
    const beat = 60 / def.bpm;
    const grid = SCROLL_SPEED * beat;
    const worldLen = def.totalBeats * grid;
    const obstacles = def.events.map(o => ({ ...o, worldX: o.beat * grid, done: false }));
    return { ...def, beat, grid, worldLen, obstacles, bestKey: 'pulseDashBest_' + def.id };
  });

  let currentLevel = null;
  let level = [];
  let best = 0;

  function loadLevel(lv) {
    currentLevel = lv;
    BPM = lv.bpm;
    BEAT = lv.beat;
    GRID = lv.grid;
    LEVEL_BEATS = lv.totalBeats;
    LEVEL_WORLD_LEN = lv.worldLen;
    SIXTEENTH = BEAT / 4;
    level = lv.obstacles.map(o => ({ ...o, done: false }));
    best = parseFloat(localStorage.getItem(lv.bestKey) || '0');
    bestEl.textContent = Math.floor(best) + '%';
    levelLabelEl.textContent = lv.name;
    hudDotEl.style.color = lv.color;
  }

  // ---------- Audio (procedural, beat-locked scheduler) ----------
  let audioCtx = null, master = null, noiseBuffer = null;
  let schedulerTimer = null, next16th = 0, nextNoteTime = 0, levelStartTime = 0;

  function initAudio() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    master = audioCtx.createGain();
    master.gain.value = 0.22;
    master.connect(audioCtx.destination);

    const len = audioCtx.sampleRate * 0.2;
    noiseBuffer = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    const data = noiseBuffer.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
  }

  function playTone(freq, time, dur, type, gainVal) {
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, time);
    g.gain.exponentialRampToValueAtTime(gainVal, time + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
    osc.connect(g);
    g.connect(master);
    osc.start(time);
    osc.stop(time + dur + 0.02);
  }

  function playHat(time) {
    const src = audioCtx.createBufferSource();
    src.buffer = noiseBuffer;
    const g = audioCtx.createGain();
    const hp = audioCtx.createBiquadFilter();
    hp.type = 'highpass';
    hp.frequency.value = 6000;
    g.gain.setValueAtTime(0.0001, time);
    g.gain.exponentialRampToValueAtTime(0.12, time + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, time + 0.05);
    src.connect(hp);
    hp.connect(g);
    g.connect(master);
    src.start(time);
    src.stop(time + 0.06);
  }

  function playCrash(time) {
    const src = audioCtx.createBufferSource();
    src.buffer = noiseBuffer;
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.3, time);
    g.gain.exponentialRampToValueAtTime(0.0001, time + 0.35);
    src.connect(g);
    g.connect(master);
    src.playbackRate.value = 0.5;
    src.start(time);
  }

  const BASS_PATTERN = [55, 55, 82.4, 55, 55, 55, 61.7, 55]; // per beat, cycles every 8 beats
  const LEAD_PATTERN = [0, 0, 1, 0, 0, 1, 0, 1]; // 16th-note pulses that get an extra blip

  function scheduleNote(sixteenth, time) {
    const beatIndex = Math.floor(sixteenth / 4);
    if (sixteenth % 4 === 0) {
      playTone(BASS_PATTERN[beatIndex % 8], time, BEAT * 0.9, 'triangle', 0.5);
    }
    if (sixteenth % 2 === 0) playHat(time);
    if (LEAD_PATTERN[sixteenth % 8] && sixteenth % 4 !== 0) {
      playTone(BASS_PATTERN[beatIndex % 8] * 4, time, 0.12, 'square', 0.06);
    }
  }

  function schedulerTick() {
    while (nextNoteTime < audioCtx.currentTime + 0.12) {
      scheduleNote(next16th, nextNoteTime);
      next16th++;
      nextNoteTime += SIXTEENTH;
    }
  }

  function startMusic() {
    initAudio();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    levelStartTime = audioCtx.currentTime + 0.05;
    nextNoteTime = levelStartTime;
    next16th = 0;
    if (schedulerTimer) clearInterval(schedulerTimer);
    schedulerTimer = setInterval(schedulerTick, 25);
  }

  function stopMusic() {
    if (schedulerTimer) { clearInterval(schedulerTimer); schedulerTimer = null; }
  }

  // ---------- Input ----------
  let isDown = false, justPressed = false;
  function pressStart(e) {
    if (e) e.preventDefault();
    if (!isDown) justPressed = true;
    isDown = true;
  }
  function pressEnd(e) { if (e) e.preventDefault(); isDown = false; }

  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') { pressStart(e); }
  });
  window.addEventListener('keyup', (e) => {
    if (e.code === 'Space') { pressEnd(e); }
  });
  canvas.addEventListener('pointerdown', pressStart);
  window.addEventListener('pointerup', pressEnd);
  document.getElementById('tapBtn').addEventListener('pointerdown', pressStart);
  document.getElementById('tapBtn').addEventListener('pointerup', pressEnd);
  document.getElementById('againBtn').addEventListener('click', () => startGame());
  document.getElementById('menuBtn').addEventListener('click', goToMenu);
  document.getElementById('crashMenuBtn').addEventListener('click', goToMenu);
  document.getElementById('winMenuBtn').addEventListener('click', goToMenu);

  // ---------- Physics constants ----------
  const P = {
    cubeGravity: 2600, cubeJump: -760,
    robotGravity: 2600, robotJump: -650, robotHoldAccel: -2800, robotMaxHold: 0.15,
    shipGravity: 1500, shipThrust: -1900, shipMaxV: 420,
    ballGravity: 1600, ballKick: 550,
    ufoGravity: 2200, ufoHop: -560,
    waveSpeed: 380,
    spiderFlipDur: 0.14,
  };

  // ---------- Player ----------
  let player, mode, state, attempts;
  let particles = [], screenShake = 0, flashAlpha = 0, hitStopTimer = 0;

  function resetPlayer() {
    player = {
      x: PLAYER_X, y: GROUND_Y - 15, vy: 0, size: 30,
      angle: 0, onSurface: true, surface: 1,
      flipping: false, flipT: 0, flipFrom: 0, flipTo: 0,
      holdTime: 0, jumping: false,
      trail: [],
    };
    mode = 'cube';
    modeLabelEl.textContent = 'CUBE';
  }

  function setMode(newMode) {
    mode = newMode;
    modeLabelEl.textContent = newMode.toUpperCase();
    player.vy = 0;
    player.angle = 0;
    player.jumping = false;
    player.flipping = false;
    if (newMode === 'cube' || newMode === 'robot') {
      player.y = GROUND_Y - player.size / 2;
      player.onSurface = true;
      player.surface = 1;
    } else if (newMode === 'ball' || newMode === 'spider') {
      player.y = GROUND_Y - player.size / 2;
      player.surface = 1;
    } else {
      player.y = MID_Y;
    }
  }

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function easeOutQuad(t) { return 1 - (1 - t) * (1 - t); }

  function recordBest(pct) {
    if (pct > best) {
      best = pct;
      localStorage.setItem(currentLevel.bestKey, String(best));
    }
    bestEl.textContent = Math.floor(best) + '%';
  }

  let pendingRestart = null, pendingOverlay = null;

  function die() {
    if (state !== 'playing') return;
    state = 'crashed';
    stopMusic();
    if (audioCtx) playCrash(audioCtx.currentTime);
    screenShake = 1;
    flashAlpha = 1;
    hitStopTimer = 0.05;
    spawnDeathBurst(PLAYER_X, player.y, MODE_COLORS[mode] || '#35f0ff');
    const pct = Math.min(100, (worldOffset() / LEVEL_WORLD_LEN) * 100);
    recordBest(pct);
    crashInfo.textContent = `PROGRESS: ${pct.toFixed(1)}%  ·  ATTEMPT ${attempts}`;
    // let the explosion play out before the overlay covers the screen
    pendingOverlay = setTimeout(() => { if (state === 'crashed') overOverlay.classList.remove('hidden'); }, 380);
    pendingRestart = setTimeout(() => {
      overOverlay.classList.add('hidden');
      attempts++;
      attemptsEl.textContent = attempts;
      startGame();
    }, 1250);
  }

  function win() {
    state = 'won';
    stopMusic();
    recordBest(100);
    winInfo.textContent = `CLEARED IN ${attempts} ATTEMPT${attempts === 1 ? '' : 'S'}  ·  BEST ${Math.floor(best)}%`;
    winOverlay.classList.remove('hidden');
  }

  function spawnDeathBurst(x, y, tintColor) {
    // chunky shattered debris (the player breaking apart)
    for (let i = 0; i < 12; i++) {
      const a = Math.random() * Math.PI * 2;
      const speed = 140 + Math.random() * 260;
      particles.push({
        x, y, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed - 120,
        life: 1, color: tintColor, size: 4 + Math.random() * 7,
        rot: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 16, shape: 'square',
      });
    }
    // fine red sparks
    for (let i = 0; i < 20; i++) {
      const a = Math.random() * Math.PI * 2;
      const speed = 260 + Math.random() * 260;
      particles.push({
        x, y, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed,
        life: 0.65, color: '#ff2d6a', size: 2 + Math.random() * 1.5, shape: 'dot',
      });
    }
  }

  // ---------- Per-mode physics ----------
  function updateCube(dt) {
    const restY = GROUND_Y - player.size / 2;
    if (justPressed && player.onSurface) { player.vy = P.cubeJump; player.onSurface = false; }
    player.vy += P.cubeGravity * dt;
    player.y += player.vy * dt;
    if (player.y >= restY) { player.y = restY; player.vy = 0; player.onSurface = true; }
    // roll continuously (grounded or airborne) so forward motion is always visible, not just mid-jump
    player.angle += dt * (SCROLL_SPEED / player.size) * (player.onSurface ? 1 : 1.6);
  }

  function updateRobot(dt) {
    const restY = GROUND_Y - player.size / 2;
    if (justPressed && player.onSurface) {
      player.vy = P.robotJump; player.onSurface = false; player.holdTime = 0;
    }
    if (isDown && !player.onSurface && player.holdTime < P.robotMaxHold) {
      player.vy += P.robotHoldAccel * dt;
      player.holdTime += dt;
    }
    player.vy += P.robotGravity * dt;
    player.y += player.vy * dt;
    if (player.y >= restY) { player.y = restY; player.vy = 0; player.onSurface = true; }
  }

  function updateShip(dt) {
    const topY = CEIL_Y + player.size / 2, botY = GROUND_Y - player.size / 2;
    player.vy += (isDown ? P.shipThrust : P.shipGravity) * dt;
    player.vy = clamp(player.vy, -P.shipMaxV, P.shipMaxV);
    player.y = clamp(player.y + player.vy * dt, topY, botY);
    if (player.y === topY || player.y === botY) player.vy = 0;
  }

  function updateBall(dt) {
    const topY = CEIL_Y + player.size / 2, botY = GROUND_Y - player.size / 2;
    if (justPressed) { player.surface *= -1; player.vy = P.ballKick * player.surface; }
    player.vy += P.ballGravity * player.surface * dt;
    player.y = clamp(player.y + player.vy * dt, topY, botY);
    player.angle += dt * 10;
  }

  function updateUfo(dt) {
    const topY = CEIL_Y + player.size / 2, botY = GROUND_Y - player.size / 2;
    if (justPressed) player.vy = P.ufoHop;
    player.vy += P.ufoGravity * dt;
    player.y += player.vy * dt;
    if (player.y > botY) { player.y = botY; player.vy = 0; }
    if (player.y < topY) { player.y = topY; player.vy = Math.max(player.vy, 0); }
  }

  function updateWave(dt) {
    const topY = CEIL_Y + player.size / 2, botY = GROUND_Y - player.size / 2;
    player.vy = isDown ? -P.waveSpeed : P.waveSpeed;
    player.y = clamp(player.y + player.vy * dt, topY, botY);
    player.trail.push({ x: player.x, y: player.y });
    if (player.trail.length > 16) player.trail.shift();
  }

  function updateSpider(dt) {
    if (player.flipping) {
      player.flipT += dt / P.spiderFlipDur;
      if (player.flipT >= 1) {
        player.flipT = 1; player.flipping = false; player.surface *= -1;
      }
      player.y = player.flipFrom + (player.flipTo - player.flipFrom) * easeOutQuad(player.flipT);
    } else if (justPressed) {
      player.flipping = true; player.flipT = 0;
      player.flipFrom = player.y;
      player.flipTo = player.surface === 1 ? (CEIL_Y + player.size / 2) : (GROUND_Y - player.size / 2);
    }
  }

  const MODE_UPDATE = {
    cube: updateCube, robot: updateRobot, ship: updateShip,
    ball: updateBall, ufo: updateUfo, wave: updateWave, spider: updateSpider,
  };

  // ---------- Obstacle geometry / collision ----------
  function obstacleRect(o, sx) {
    if (o.kind === 'spike') {
      const y = o.side === 'floor' ? GROUND_Y - 32 : CEIL_Y;
      return { x: sx - 15, y, w: 30, h: 32 };
    }
    if (o.kind === 'block') {
      const y = o.side === 'floor' ? GROUND_Y - o.depth : CEIL_Y;
      return { x: sx - 18, y, w: 36, h: o.depth };
    }
    if (o.kind === 'pad') return { x: sx - 20, y: GROUND_Y - 12, w: 40, h: 12 };
    return null;
  }

  function playerRect() {
    const s = player.size * 0.74; // forgiving hitbox, smaller than the visual sprite
    return { x: player.x - s / 2, y: player.y - s / 2, w: s, h: s };
  }

  function inset(r, amt) {
    return { x: r.x + amt, y: r.y + amt, w: r.w - amt * 2, h: r.h - amt * 2 };
  }

  function overlap(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  function worldOffset() {
    if (!audioCtx) return 0;
    const elapsed = Math.max(0, audioCtx.currentTime - levelStartTime);
    return elapsed * SCROLL_SPEED;
  }

  // ---------- Game flow ----------
  function startGame(lv) {
    if (pendingRestart) { clearTimeout(pendingRestart); pendingRestart = null; }
    if (pendingOverlay) { clearTimeout(pendingOverlay); pendingOverlay = null; }
    if (lv) {
      loadLevel(lv);
      attempts = 1;
      attemptsEl.textContent = attempts;
    }
    resetPlayer();
    particles = [];
    screenShake = 0;
    flashAlpha = 0;
    hitStopTimer = 0;
    state = 'playing';
    level.forEach(o => { o.done = false; });
    menuOverlay.classList.add('hidden');
    overOverlay.classList.add('hidden');
    winOverlay.classList.add('hidden');
    startMusic();
    lastTime = performance.now();
    requestAnimationFrame(loop);
  }

  function goToMenu() {
    if (pendingRestart) { clearTimeout(pendingRestart); pendingRestart = null; }
    if (pendingOverlay) { clearTimeout(pendingOverlay); pendingOverlay = null; }
    stopMusic();
    isDown = false;
    state = 'menu';
    currentLevel = null;
    levelLabelEl.textContent = '—';
    hudDotEl.style.color = 'var(--neon-dim)';
    modeLabelEl.textContent = '—';
    attemptsEl.textContent = '—';
    bestEl.textContent = '—';
    progressBar.style.width = '0%';
    overOverlay.classList.add('hidden');
    winOverlay.classList.add('hidden');
    menuOverlay.classList.remove('hidden');
    refreshLevelList();
    demoLastTime = performance.now();
    requestAnimationFrame(attractLoop);
  }

  function refreshLevelList() {
    levelListEl.querySelectorAll('.level-card-best').forEach(el => {
      const lv = LEVELS.find(l => l.id === el.dataset.levelId);
      if (!lv) return;
      const b = parseFloat(localStorage.getItem(lv.bestKey) || '0');
      el.textContent = b > 0 ? Math.floor(b) + '%' : '—';
    });
  }

  function buildLevelList() {
    levelListEl.innerHTML = '';
    LEVELS.forEach(lv => {
      const b = parseFloat(localStorage.getItem(lv.bestKey) || '0');
      const btn = document.createElement('button');
      btn.className = 'level-card';
      btn.style.setProperty('--card-color', lv.color);
      btn.innerHTML = `
        <span>
          <span class="level-card-name">${lv.name}</span><br/>
          <span class="level-card-diff">${lv.difficulty}</span>
        </span>
        <span class="level-card-best" data-level-id="${lv.id}">${b > 0 ? Math.floor(b) + '%' : '—'}</span>
      `;
      btn.addEventListener('click', () => startGame(lv));
      levelListEl.appendChild(btn);
    });
  }

  attempts = 1;
  attemptsEl.textContent = attempts;

  let lastTime = 0;
  function loop(now) {
    let dt = (now - lastTime) / 1000;
    lastTime = now;
    dt = Math.min(dt, 1 / 30);

    if (state === 'playing') update(dt);

    if (hitStopTimer > 0) {
      hitStopTimer -= dt;
    } else {
      updateEffects(dt);
    }

    draw();
    justPressed = false;
    if (state === 'playing' || particles.length > 0 || screenShake > 0 || flashAlpha > 0) {
      requestAnimationFrame(loop);
    }
  }

  function updateEffects(dt) {
    particles.forEach(p => {
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vy += 700 * dt;
      p.vx *= Math.max(0, 1 - dt * 1.5);
      if (p.rot !== undefined) p.rot += p.vr * dt;
      p.life -= dt * (p.decay || 1.5);
    });
    particles = particles.filter(p => p.life > 0);
    if (screenShake > 0) screenShake = Math.max(0, screenShake - dt * 2.6);
    if (flashAlpha > 0) flashAlpha = Math.max(0, flashAlpha - dt * 2.8);
  }

  function update(dt) {
    const off = worldOffset();
    (MODE_UPDATE[mode] || updateCube)(dt);

    const pRect = playerRect();
    for (const o of level) {
      const sx = PLAYER_X + o.worldX - off;
      if (sx < -60 || sx > W + 60) continue;

      if (o.kind === 'portal') {
        if (!o.done && sx <= PLAYER_X) { o.done = true; setMode(o.mode); }
        continue;
      }
      if (o.kind === 'finish') {
        if (!o.done && sx <= PLAYER_X) { o.done = true; win(); }
        continue;
      }
      if (o.kind === 'pad') {
        const r = obstacleRect(o, sx);
        if (!o.done && overlap(pRect, r)) {
          o.done = true;
          if (mode === 'cube' || mode === 'robot') { player.vy = -1000; player.onSurface = false; }
          else if (mode === 'ufo') { player.vy = -900; }
          else if (mode === 'ball') { player.vy = -900 * player.surface; }
        }
        continue;
      }
      const r = obstacleRect(o, sx);
      const hit = r && inset(r, 3);
      if (hit && overlap(pRect, hit)) { die(); return; }
    }

    progressBar.style.width = clamp((off / LEVEL_WORLD_LEN) * 100, 0, 100) + '%';
  }

  // ---------- Rendering ----------
  function drawBackdrop(off) {
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#0a0b18');
    grad.addColorStop(1, '#131233');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    ctx.strokeStyle = 'rgba(53,240,255,0.12)';
    ctx.lineWidth = 1;
    const gridOff = off % 40;
    for (let x = -gridOff; x < W; x += 40) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
  }

  function drawGroundCeil(off, color) {
    ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.shadowColor = color; ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.moveTo(0, GROUND_Y); ctx.lineTo(W, GROUND_Y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, CEIL_Y); ctx.lineTo(W, CEIL_Y); ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(10,11,24,0.9)';
    ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
    ctx.fillRect(0, 0, W, CEIL_Y);

    // scrolling tread marks: an unmistakable "this is moving" cue even with no obstacles in view
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,0.4)';
    ctx.lineWidth = 3;
    ctx.setLineDash([16, 20]);
    ctx.lineDashOffset = -off;
    ctx.beginPath(); ctx.moveTo(0, GROUND_Y + 11); ctx.lineTo(W, GROUND_Y + 11); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, CEIL_Y - 11); ctx.lineTo(W, CEIL_Y - 11); ctx.stroke();
    ctx.restore();
  }

  function drawObstacles(obstacles, off, color) {
    for (const o of obstacles) {
      const sx = PLAYER_X + o.worldX - off;
      if (sx < -60 || sx > W + 60) continue;
      ctx.save();
      if (o.kind === 'spike') {
        const up = o.side === 'floor';
        const baseY = up ? GROUND_Y : CEIL_Y;
        const tipY = up ? GROUND_Y - 32 : CEIL_Y + 32;
        ctx.fillStyle = '#ff2d6a'; ctx.shadowColor = '#ff2d6a'; ctx.shadowBlur = 12;
        ctx.beginPath();
        ctx.moveTo(sx - 15, baseY);
        ctx.lineTo(sx + 15, baseY);
        ctx.lineTo(sx, tipY);
        ctx.closePath(); ctx.fill();
      } else if (o.kind === 'block') {
        const r = obstacleRect(o, sx);
        ctx.fillStyle = '#ff2d6a'; ctx.shadowColor = '#ff2d6a'; ctx.shadowBlur = 10;
        ctx.fillRect(r.x, r.y, r.w, r.h);
      } else if (o.kind === 'pad') {
        ctx.fillStyle = '#ffe14d'; ctx.shadowColor = '#ffe14d'; ctx.shadowBlur = 14;
        ctx.fillRect(sx - 20, GROUND_Y - 8, 40, 8);
      } else if (o.kind === 'portal') {
        const c = MODE_COLORS[o.mode] || '#fff';
        ctx.strokeStyle = c; ctx.shadowColor = c; ctx.shadowBlur = 18; ctx.lineWidth = 6;
        ctx.beginPath(); ctx.moveTo(sx, CEIL_Y); ctx.lineTo(sx, GROUND_Y); ctx.stroke();
      } else if (o.kind === 'finish') {
        ctx.strokeStyle = '#4dff8a'; ctx.shadowColor = '#4dff8a'; ctx.shadowBlur = 18; ctx.lineWidth = 8;
        ctx.beginPath(); ctx.moveTo(sx, CEIL_Y); ctx.lineTo(sx, GROUND_Y); ctx.stroke();
      }
      ctx.restore();
    }
  }

  function drawPlayer(color) {
    const s = player.size;
    ctx.save();
    ctx.translate(player.x, player.y);
    ctx.shadowColor = color; ctx.shadowBlur = 16;
    ctx.fillStyle = color;

    if (mode === 'cube' || mode === 'robot') {
      ctx.rotate(player.angle);
      ctx.fillRect(-s / 2, -s / 2, s, s);
      ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.strokeRect(-s / 2, -s / 2, s, s);
      if (mode === 'robot') {
        ctx.fillRect(-s / 2 - 6, s / 2 - 6, 6, 10);
        ctx.fillRect(s / 2, s / 2 - 6, 6, 10);
      }
    } else if (mode === 'ship') {
      ctx.beginPath();
      ctx.moveTo(-s * 0.7, 0); ctx.lineTo(s * 0.5, -s * 0.4); ctx.lineTo(s * 0.5, s * 0.4);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(255,180,60,0.7)';
      ctx.beginPath(); ctx.moveTo(-s * 0.7, 0); ctx.lineTo(-s * 1.3, -6); ctx.lineTo(-s * 1.3, 6); ctx.closePath(); ctx.fill();
    } else if (mode === 'ball') {
      ctx.rotate(player.angle);
      ctx.beginPath(); ctx.arc(0, 0, s / 2, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(-s / 2, 0); ctx.lineTo(s / 2, 0); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, -s / 2); ctx.lineTo(0, s / 2); ctx.stroke();
    } else if (mode === 'ufo') {
      ctx.beginPath(); ctx.ellipse(0, 4, s * 0.55, s * 0.28, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(0, -2, s * 0.32, Math.PI, 0); ctx.fill();
    } else if (mode === 'wave') {
      ctx.strokeStyle = color; ctx.lineWidth = 3; ctx.beginPath();
      player.trail.forEach((p, i) => {
        const lx = p.x - player.x, ly = p.y - player.y;
        if (i === 0) ctx.moveTo(lx, ly); else ctx.lineTo(lx, ly);
      });
      ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, -8); ctx.lineTo(8, 0); ctx.lineTo(0, 8); ctx.lineTo(-8, 0); ctx.closePath(); ctx.fill();
    } else if (mode === 'spider') {
      ctx.fillRect(-s / 3, -s / 3, s * 0.66, s * 0.66);
      ctx.strokeStyle = color; ctx.lineWidth = 2;
      for (let i = -1; i <= 1; i += 2) {
        ctx.beginPath(); ctx.moveTo(i * s / 3, -s / 4); ctx.lineTo(i * s * 0.7, -s * 0.6); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(i * s / 3, s / 4); ctx.lineTo(i * s * 0.7, s * 0.6); ctx.stroke();
      }
    }
    ctx.restore();
  }

  function drawParticles() {
    particles.forEach(p => {
      ctx.save();
      ctx.globalAlpha = Math.max(p.life, 0);
      ctx.translate(p.x, p.y);
      if (p.rot) ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.shadowColor = p.color; ctx.shadowBlur = 6;
      if (p.shape === 'square') {
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
      } else {
        ctx.beginPath(); ctx.arc(0, 0, p.size || 3, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
    });
    ctx.globalAlpha = 1;
  }

  function draw() {
    ctx.save();
    if (screenShake > 0) {
      ctx.translate((Math.random() - 0.5) * 14 * screenShake, (Math.random() - 0.5) * 14 * screenShake);
    }
    const off = worldOffset();
    // beat-synced camera punch: a quick forward zoom on every beat, so the whole
    // scene visibly lurches forward in time with the music, not just the obstacles
    if (state === 'playing') {
      const beatFrac = (off / GRID) % 1;
      const punch = beatFrac < 0.14 ? (1 - beatFrac / 0.14) * 0.028 : 0;
      if (punch > 0) {
        ctx.translate(W / 2, H / 2);
        ctx.scale(1 + punch, 1 + punch);
        ctx.translate(-W / 2, -H / 2);
      }
    }
    const color = MODE_COLORS[mode] || '#35f0ff';
    drawBackdrop(off);
    drawGroundCeil(off, color);
    drawObstacles(level, off, color);
    if (state === 'playing') drawPlayer(color);
    drawParticles();
    ctx.restore();
    if (flashAlpha > 0) {
      ctx.fillStyle = `rgba(255,45,106,${(flashAlpha * 0.45).toFixed(3)})`;
      ctx.fillRect(0, 0, W, H);
    }
  }

  // ---------- Attract mode: cycles through all four levels behind the menu ----------
  let demoOffset = 0, demoT = 0, demoLastTime = 0, demoLevelIdx = 0, demoSwitchAt = 7;
  function drawAttractPlayer(color) {
    const hopPeriod = 0.55;
    const t = (demoT % hopPeriod) / hopPeriod;
    const hop = Math.sin(t * Math.PI);
    const y = (GROUND_Y - 15) - hop * 90;
    ctx.save();
    ctx.translate(PLAYER_X, y);
    ctx.rotate(demoT * 3.2);
    ctx.shadowColor = color; ctx.shadowBlur = 16;
    ctx.fillStyle = color;
    ctx.fillRect(-15, -15, 30, 30);
    ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.strokeRect(-15, -15, 30, 30);
    ctx.restore();
  }

  function attractLoop(now) {
    if (state !== 'menu') return;
    let dt = (now - demoLastTime) / 1000;
    demoLastTime = now;
    dt = Math.min(dt, 1 / 30);
    demoT += dt;

    if (demoT > demoSwitchAt) {
      demoLevelIdx = (demoLevelIdx + 1) % LEVELS.length;
      demoOffset = 0;
      demoSwitchAt = demoT + 7;
    }
    const demoLv = LEVELS[demoLevelIdx];
    demoOffset = (demoOffset + SCROLL_SPEED * dt) % demoLv.worldLen;

    drawBackdrop(demoOffset);
    drawGroundCeil(demoOffset, demoLv.color);
    drawObstacles(demoLv.obstacles, demoOffset, demoLv.color);
    drawAttractPlayer(demoLv.color);

    requestAnimationFrame(attractLoop);
  }

  resetPlayer();
  buildLevelList();
  state = 'menu';
  demoLastTime = performance.now();
  requestAnimationFrame(attractLoop);
})();
</script>
</body>
</html>
