<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Neon Snake</title>
<style>
  :root {
    --bg: #0a0e17;
    --panel: #111827;
    --accent: #39ff88;
    --accent2: #00d4ff;
    --danger: #ff3860;
    --text: #e5eefc;
    --muted: #6b7a99;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: radial-gradient(circle at 50% 20%, #14203a 0%, #0a0e17 70%);
    color: var(--text);
    font-family: 'Courier New', Consolas, monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .app {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 16px;
  }
  h1 {
    margin: 0;
    font-size: 28px;
    letter-spacing: 4px;
    color: var(--accent);
    text-shadow: 0 0 12px rgba(57,255,136,0.6);
  }
  .hud {
    display: flex;
    justify-content: space-between;
    width: 100%;
    max-width: 520px;
    font-size: 15px;
    color: var(--muted);
    padding: 0 4px;
  }
  .hud span b { color: var(--accent2); }
  .board-wrap {
    position: relative;
    border: 2px solid #24304a;
    border-radius: 10px;
    box-shadow: 0 0 30px rgba(0,212,255,0.15), inset 0 0 40px rgba(0,0,0,0.6);
    background: var(--panel);
    padding: 6px;
  }
  canvas {
    display: block;
    background: #0d1424;
    border-radius: 6px;
    image-rendering: pixelated;
  }
  .overlay {
    position: absolute;
    inset: 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: rgba(6, 9, 16, 0.86);
    border-radius: 6px;
    text-align: center;
    padding: 20px;
  }
  .overlay h2 {
    margin: 0;
    font-size: 24px;
    color: var(--accent2);
    text-shadow: 0 0 10px rgba(0,212,255,0.7);
  }
  .overlay p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.6; }
  .overlay .danger { color: var(--danger); font-size: 20px; }
  button {
    font-family: inherit;
    font-size: 14px;
    letter-spacing: 2px;
    background: var(--accent);
    color: #06210f;
    border: none;
    padding: 10px 22px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
    transition: transform 0.1s ease, box-shadow 0.1s ease;
  }
  button:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(57,255,136,0.4); }
  button:active { transform: translateY(0); }
  .hint { color: var(--muted); font-size: 12px; text-align: center; max-width: 480px; }
  .hidden { display: none !important; }
  .touch-controls {
    display: none;
    grid-template-columns: repeat(3, 56px);
    grid-template-rows: repeat(3, 56px);
    gap: 6px;
    margin-top: 4px;
  }
  .touch-controls button {
    width: 56px; height: 56px; padding: 0; font-size: 20px;
    background: var(--panel); color: var(--accent2); border: 1px solid #24304a;
  }
  @media (pointer: coarse) {
    .touch-controls { display: grid; }
  }
</style>
</head>
<body>
  <div class="app">
    <h1>NEON SNAKE</h1>
    <div class="hud">
      <span>SCORE: <b id="score">0</b></span>
      <span>BEST: <b id="best">0</b></span>
      <span>SPEED: <b id="speed">1</b></span>
    </div>
    <div class="board-wrap">
      <canvas id="board" width="480" height="480"></canvas>
      <div id="startOverlay" class="overlay">
        <h2>NEON SNAKE</h2>
        <p>Use arrow keys or WASD to move.<br/>Eat the glowing orbs, avoid walls and yourself.</p>
        <button id="startBtn">START GAME</button>
      </div>
      <div id="pauseOverlay" class="overlay hidden">
        <h2>PAUSED</h2>
        <button id="resumeBtn">RESUME</button>
      </div>
      <div id="overOverlay" class="overlay hidden">
        <h2 class="danger">GAME OVER</h2>
        <p id="finalScore">Score: 0</p>
        <button id="restartBtn">PLAY AGAIN</button>
      </div>
    </div>
    <div class="hint">Arrow keys / WASD to move &middot; Space to pause &middot; Enter to start/restart</div>
    <div class="touch-controls">
      <span></span><button data-dir="up">▲</button><span></span>
      <button data-dir="left">◀</button><span></span><button data-dir="right">▶</button>
      <span></span><button data-dir="down">▼</button><span></span>
    </div>
  </div>

<script>
(() => {
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const GRID = 24;
  const CELL = canvas.width / GRID;

  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const speedEl = document.getElementById('speed');
  const startOverlay = document.getElementById('startOverlay');
  const pauseOverlay = document.getElementById('pauseOverlay');
  const overOverlay = document.getElementById('overOverlay');
  const finalScoreEl = document.getElementById('finalScore');

  const BEST_KEY = 'neonSnakeBest';
  let best = parseInt(localStorage.getItem(BEST_KEY) || '0', 10);
  bestEl.textContent = best;

  const BASE_INTERVAL = 140;
  const MIN_INTERVAL = 60;

  let snake, dir, nextDir, food, score, level, running, paused, gameOver, lastTick, interval, particles;

  function reset() {
    const mid = Math.floor(GRID / 2);
    snake = [
      { x: mid - 1, y: mid },
      { x: mid - 2, y: mid },
      { x: mid - 3, y: mid },
    ];
    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    score = 0;
    level = 1;
    interval = BASE_INTERVAL;
    running = false;
    paused = false;
    gameOver = false;
    particles = [];
    placeFood();
    updateHud();
  }

  function placeFood() {
    let pos;
    do {
      pos = { x: Math.floor(Math.random() * GRID), y: Math.floor(Math.random() * GRID) };
    } while (snake.some(s => s.x === pos.x && s.y === pos.y));
    food = pos;
  }

  function updateHud() {
    scoreEl.textContent = score;
    speedEl.textContent = level;
    bestEl.textContent = best;
  }

  function setDir(nx, ny) {
    if (dir.x === -nx && dir.y === -ny) return;
    nextDir = { x: nx, y: ny };
  }

  const KEY_MAP = {
    ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0],
    w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0],
    W: [0, -1], S: [0, 1], A: [-1, 0], D: [1, 0],
  };

  window.addEventListener('keydown', (e) => {
    if (KEY_MAP[e.key]) {
      e.preventDefault();
      const [nx, ny] = KEY_MAP[e.key];
      setDir(nx, ny);
      if (!running && !gameOver) startGame();
    } else if (e.key === ' ') {
      e.preventDefault();
      togglePause();
    } else if (e.key === 'Enter') {
      if (!running || gameOver) startGame();
    }
  });

  document.querySelectorAll('.touch-controls button').forEach(btn => {
    btn.addEventListener('click', () => {
      const d = btn.dataset.dir;
      if (d === 'up') setDir(0, -1);
      if (d === 'down') setDir(0, 1);
      if (d === 'left') setDir(-1, 0);
      if (d === 'right') setDir(1, 0);
      if (!running && !gameOver) startGame();
    });
  });

  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('restartBtn').addEventListener('click', startGame);
  document.getElementById('resumeBtn').addEventListener('click', togglePause);

  function togglePause() {
    if (!running || gameOver) return;
    paused = !paused;
    pauseOverlay.classList.toggle('hidden', !paused);
    if (!paused) {
      lastTick = performance.now();
      requestAnimationFrame(loop);
    }
  }

  function startGame() {
    reset();
    running = true;
    startOverlay.classList.add('hidden');
    pauseOverlay.classList.add('hidden');
    overOverlay.classList.add('hidden');
    lastTick = performance.now();
    requestAnimationFrame(loop);
  }

  function spawnParticles(x, y, color) {
    for (let i = 0; i < 12; i++) {
      const angle = (Math.PI * 2 * i) / 12;
      particles.push({
        x: x * CELL + CELL / 2,
        y: y * CELL + CELL / 2,
        vx: Math.cos(angle) * 2,
        vy: Math.sin(angle) * 2,
        life: 1,
        color,
      });
    }
  }

  function step() {
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID ||
        snake.some(s => s.x === head.x && s.y === head.y)) {
      endGame();
      return;
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score += 10;
      spawnParticles(food.x, food.y, '#39ff88');
      if (score % 50 === 0) {
        level++;
        interval = Math.max(MIN_INTERVAL, BASE_INTERVAL - (level - 1) * 10);
      }
      placeFood();
      if (score > best) {
        best = score;
        localStorage.setItem(BEST_KEY, String(best));
      }
      updateHud();
    } else {
      snake.pop();
    }
  }

  function endGame() {
    running = false;
    gameOver = true;
    spawnParticles(snake[0].x, snake[0].y, '#ff3860');
    finalScoreEl.textContent = `Score: ${score}  (Best: ${best})`;
    overOverlay.classList.remove('hidden');
    drawParticleBurst();
  }

  function drawParticleBurst() {
    let frames = 0;
    function anim() {
      draw();
      updateParticles();
      frames++;
      if (frames < 30) requestAnimationFrame(anim);
    }
    anim();
  }

  function updateParticles() {
    particles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.life -= 0.04;
    });
    particles = particles.filter(p => p.life > 0);
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = 'rgba(36,48,74,0.5)';
    ctx.lineWidth = 1;
    for (let i = 1; i < GRID; i++) {
      ctx.beginPath();
      ctx.moveTo(i * CELL, 0);
      ctx.lineTo(i * CELL, canvas.height);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, i * CELL);
      ctx.lineTo(canvas.width, i * CELL);
      ctx.stroke();
    }

    const foodPulse = 0.5 + 0.5 * Math.sin(performance.now() / 150);
    ctx.save();
    ctx.shadowColor = '#00d4ff';
    ctx.shadowBlur = 12 + foodPulse * 8;
    ctx.fillStyle = '#00d4ff';
    ctx.beginPath();
    ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL / 2 - 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    snake.forEach((seg, i) => {
      const t = i / snake.length;
      ctx.fillStyle = i === 0 ? '#39ff88' : `rgba(57, 255, 136, ${1 - t * 0.6})`;
      ctx.shadowColor = '#39ff88';
      ctx.shadowBlur = i === 0 ? 14 : 4;
      const pad = 1.5;
      ctx.fillRect(seg.x * CELL + pad, seg.y * CELL + pad, CELL - pad * 2, CELL - pad * 2);
    });
    ctx.shadowBlur = 0;

    particles.forEach(p => {
      ctx.globalAlpha = Math.max(p.life, 0);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
  }

  function loop(now) {
    if (!running || paused) return;
    if (now - lastTick >= interval) {
      step();
      lastTick = now;
      if (gameOver) return;
    }
    draw();
    requestAnimationFrame(loop);
  }

  reset();
  draw();
})();
</script>
</body>
</html>
