<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Amber Snake</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fff3e4;
    --card-top: #ffe8cf;
    --card-mid: #ffd9c2;
    --card-bottom: #fbc9b9;
    --screen: #fffbf5;
    --screen-edge: #f6e4d3;
    --ink: #5b4b5a;
    --ink-bright: #3e2f3d;
    --ink-dim: #a5919f;
    --accent: #ff8fa3;
    --accent-deep: #e8637c;
    --mint: #7fdcb0;
    --mint-deep: #4fb98c;
    --danger: #ff6f79;
    --danger-deep: #e3505a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Quicksand', 'Trebuchet MS', sans-serif;
    font-weight: 600;
    display: flex;
    align-items: safe center;
    justify-content: center;
    overflow-y: auto;
    overflow-x: hidden;
  }
  body { padding: 20px 0; }
  .display-font { font-family: 'Baloo 2', 'Trebuchet MS', sans-serif; font-weight: 700; }

  .cabinet {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    padding: 20px 22px 24px;
    background: linear-gradient(165deg, var(--card-top) 0%, var(--card-mid) 55%, var(--card-bottom) 100%);
    border-radius: 28px;
    box-shadow:
      0 18px 40px rgba(200, 120, 90, 0.25),
      inset 0 2px 0 rgba(255,255,255,0.6);
  }

  .marquee {
    text-align: center;
    font-size: 16px;
    letter-spacing: 2px;
    color: #fff;
    text-shadow: 0 1px 0 rgba(0,0,0,0.15);
    background: linear-gradient(135deg, var(--accent), var(--accent-deep));
    padding: 10px 28px;
    border-radius: 999px;
    box-shadow: 0 4px 0 var(--accent-deep), 0 8px 16px rgba(232,99,124,0.35);
  }

  .hud {
    display: flex;
    justify-content: space-between;
    width: 100%;
    max-width: 480px;
    font-size: 13px;
    letter-spacing: 0.5px;
    color: var(--ink-dim);
    padding: 0 4px;
  }
  .hud b {
    font-family: 'Baloo 2', sans-serif;
    color: var(--ink-bright);
    font-size: 16px;
  }

  .screen-frame {
    position: relative;
    border-radius: 20px;
    padding: 12px;
    background: var(--screen-edge);
    box-shadow: inset 0 0 0 2px rgba(255,255,255,0.5), 0 2px 6px rgba(190,140,110,0.15);
  }
  .board-wrap {
    position: relative;
    border-radius: 14px;
    overflow: hidden;
    background: var(--screen);
    box-shadow: inset 0 2px 10px rgba(190,140,110,0.18);
  }
  canvas {
    display: block;
    background: var(--screen);
    position: relative;
    z-index: 1;
  }

  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    background: rgba(255, 251, 245, 0.94);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    text-align: center;
    padding: 20px;
    z-index: 4;
  }
  .overlay h2 {
    margin: 0;
    font-size: 22px;
    line-height: 1.5;
    color: var(--ink-bright);
  }
  .overlay p {
    margin: 0;
    color: var(--ink-dim);
    font-size: 12.5px;
    line-height: 1.9;
    max-width: 320px;
  }
  .overlay .danger { color: var(--danger-deep); }

  button {
    font-family: 'Baloo 2', sans-serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.5px;
    background: linear-gradient(180deg, var(--accent), var(--accent-deep));
    color: #fff;
    border: none;
    padding: 12px 28px;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 4px 0 var(--accent-deep), 0 6px 14px rgba(232,99,124,0.35);
    transition: transform 0.08s ease, box-shadow 0.08s ease;
  }
  button:hover { filter: brightness(1.05); }
  button:active { transform: translateY(4px); box-shadow: 0 0 0 var(--accent-deep), 0 2px 6px rgba(232,99,124,0.3); }
  button:focus-visible { outline: 2px solid var(--accent-deep); outline-offset: 3px; }
  button.secondary {
    background: linear-gradient(180deg, var(--mint), var(--mint-deep));
    box-shadow: 0 4px 0 var(--mint-deep), 0 6px 14px rgba(79,185,140,0.3);
  }
  button.secondary:active { box-shadow: 0 0 0 var(--mint-deep), 0 2px 6px rgba(79,185,140,0.3); }

  .overlay-buttons {
    display: flex;
    gap: 10px;
  }

  .hint {
    color: var(--ink-dim);
    font-size: 11px;
    letter-spacing: 0.3px;
    text-align: center;
    max-width: 480px;
    line-height: 1.7;
  }
  .hidden { display: none !important; }

  .touch-controls {
    display: grid;
    grid-template-columns: repeat(3, 46px);
    grid-template-rows: repeat(3, 46px);
    gap: 8px;
  }
  .touch-controls button {
    width: 46px; height: 46px; padding: 0; font-size: 16px;
    border-radius: 50%;
    background: linear-gradient(180deg, var(--mint), var(--mint-deep));
    box-shadow: 0 3px 0 var(--mint-deep), 0 4px 10px rgba(79,185,140,0.3);
  }
  .touch-controls button:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--mint-deep); }
</style>
</head>
<body>
  <div class="cabinet">
    <div class="marquee display-font">AMBER SNAKE</div>
    <div class="hud">
      <span>SCORE <b id="score">0</b></span>
      <span>BEST <b id="best">0</b></span>
      <span>LEVEL <b id="speed">1</b></span>
    </div>
    <div class="screen-frame">
      <div class="board-wrap">
        <canvas id="board" width="432" height="432"></canvas>
        <div id="startOverlay" class="overlay">
          <h2 class="display-font">AMBER<br/>SNAKE</h2>
          <p>ARROWS OR WASD TO MOVE.<br/>EAT THE PELLETS.<br/>DON'T HIT THE WALLS OR YOURSELF.</p>
          <button id="startBtn">INSERT COIN</button>
        </div>
        <div id="pauseOverlay" class="overlay hidden">
          <h2 class="display-font">PAUSED</h2>
          <button id="resumeBtn">RESUME</button>
        </div>
        <div id="overOverlay" class="overlay hidden">
          <h2 class="display-font danger">GAME<br/>OVER</h2>
          <p id="finalScore">SCORE: 0</p>
          <div class="overlay-buttons">
            <button id="restartBtn">CONTINUE</button>
            <button id="homeBtn" class="secondary">HOME</button>
          </div>
        </div>
      </div>
    </div>
    <div class="hint">ARROWS / WASD MOVE &nbsp;·&nbsp; SPACE PAUSE &nbsp;·&nbsp; ENTER START</div>
    <a href="jumble.html" style="color: var(--ink-dim); font-size: 11px; letter-spacing: 1px; text-decoration: none;">PLAY JUMBLE →</a>
    <div class="touch-controls">
      <span></span><button data-dir="up">▲</button><span></span>
      <button data-dir="left">◀</button><span></span><button data-dir="right">▶</button>
      <span></span><button data-dir="down">▼</button><span></span>
    </div>
  </div>

<script>
(() => {
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const GRID = 24;
  const CELL = canvas.width / GRID;

  const COLOR_HEAD_BRIGHT = '#b7f0d6';
  const COLOR_BODY = '#7fdcb0';
  const COLOR_OUTLINE = 'rgba(62, 47, 61, 0.35)';
  const COLOR_GRID = 'rgba(165, 145, 160, 0.18)';
  const COLOR_FOOD = '#ff8fa3';
  const COLOR_FOOD_BRIGHT = '#ffc2ce';
  const COLOR_DANGER = '#ff6f79';
  const COLOR_INK = '#3e2f3d';
  const REDUCE_MOTION = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const speedEl = document.getElementById('speed');
  const startOverlay = document.getElementById('startOverlay');
  const pauseOverlay = document.getElementById('pauseOverlay');
  const overOverlay = document.getElementById('overOverlay');
  const finalScoreEl = document.getElementById('finalScore');

  const BEST_KEY = 'amberSnakeBest';
  let best = parseInt(localStorage.getItem(BEST_KEY) || '0', 10);
  bestEl.textContent = best;

  const BASE_INTERVAL = 140;
  const MIN_INTERVAL = 60;

  let snake, dir, nextDir, food, score, level, running, paused, gameOver, lastTick, interval, particles;

  function reset() {
    const mid = Math.floor(GRID / 2);
    snake = [
      { x: mid - 1, y: mid },
      { x: mid - 2, y: mid },
      { x: mid - 3, y: mid },
    ];
    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    score = 0;
    level = 1;
    interval = BASE_INTERVAL;
    running = false;
    paused = false;
    gameOver = false;
    particles = [];
    placeFood();
    updateHud();
  }

  function placeFood() {
    let pos;
    do {
      pos = { x: Math.floor(Math.random() * GRID), y: Math.floor(Math.random() * GRID) };
    } while (snake.some(s => s.x === pos.x && s.y === pos.y));
    food = pos;
  }

  function updateHud() {
    scoreEl.textContent = score;
    speedEl.textContent = level;
    bestEl.textContent = best;
  }

  function setDir(nx, ny) {
    if (dir.x === -nx && dir.y === -ny) return;
    nextDir = { x: nx, y: ny };
  }

  const KEY_MAP = {
    ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0],
    w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0],
    W: [0, -1], S: [0, 1], A: [-1, 0], D: [1, 0],
  };

  window.addEventListener('keydown', (e) => {
    if (KEY_MAP[e.key]) {
      e.preventDefault();
      const [nx, ny] = KEY_MAP[e.key];
      setDir(nx, ny);
      if (!running && !gameOver) startGame();
    } else if (e.key === ' ') {
      e.preventDefault();
      togglePause();
    } else if (e.key === 'Enter') {
      if (!running || gameOver) startGame();
    }
  });

  document.querySelectorAll('.touch-controls button').forEach(btn => {
    btn.addEventListener('click', () => {
      const d = btn.dataset.dir;
      if (d === 'up') setDir(0, -1);
      if (d === 'down') setDir(0, 1);
      if (d === 'left') setDir(-1, 0);
      if (d === 'right') setDir(1, 0);
      if (!running && !gameOver) startGame();
    });
  });

  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('restartBtn').addEventListener('click', startGame);
  document.getElementById('resumeBtn').addEventListener('click', togglePause);
  document.getElementById('homeBtn').addEventListener('click', () => {
    reset();
    overOverlay.classList.add('hidden');
    startOverlay.classList.remove('hidden');
  });

  function togglePause() {
    if (!running || gameOver) return;
    paused = !paused;
    pauseOverlay.classList.toggle('hidden', !paused);
    if (!paused) {
      lastTick = performance.now();
      requestAnimationFrame(loop);
    }
  }

  function startGame() {
    reset();
    running = true;
    startOverlay.classList.add('hidden');
    pauseOverlay.classList.add('hidden');
    overOverlay.classList.add('hidden');
    lastTick = performance.now();
    requestAnimationFrame(loop);
  }

  function spawnParticles(x, y, color) {
    for (let i = 0; i < 12; i++) {
      const angle = (Math.PI * 2 * i) / 12;
      particles.push({
        x: x * CELL + CELL / 2,
        y: y * CELL + CELL / 2,
        vx: Math.cos(angle) * 2,
        vy: Math.sin(angle) * 2,
        life: 1,
        color,
      });
    }
  }

  function step() {
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID ||
        snake.some(s => s.x === head.x && s.y === head.y)) {
      endGame();
      return;
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score += 10;
      spawnParticles(food.x, food.y, COLOR_FOOD_BRIGHT);
      if (score % 50 === 0) {
        level++;
        interval = Math.max(MIN_INTERVAL, BASE_INTERVAL - (level - 1) * 10);
      }
      placeFood();
      if (score > best) {
        best = score;
        localStorage.setItem(BEST_KEY, String(best));
      }
      updateHud();
    } else {
      snake.pop();
    }
  }

  function endGame() {
    running = false;
    gameOver = true;
    spawnParticles(snake[0].x, snake[0].y, COLOR_DANGER);
    finalScoreEl.textContent = `SCORE: ${score}  (BEST: ${best})`;
    overOverlay.classList.remove('hidden');
    drawParticleBurst();
  }

  function drawParticleBurst() {
    let frames = 0;
    function anim() {
      draw();
      updateParticles();
      frames++;
      if (frames < 30) requestAnimationFrame(anim);
    }
    anim();
  }

  function updateParticles() {
    particles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.life -= 0.04;
    });
    particles = particles.filter(p => p.life > 0);
  }

  function drawSnake() {
    const pts = snake.map(s => ({ x: s.x * CELL + CELL / 2, y: s.y * CELL + CELL / 2 }));
    const n = pts.length;

    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.shadowColor = COLOR_BODY;
    for (let i = n - 1; i > 0; i--) {
      const t = i / (n - 1);
      ctx.lineWidth = CELL * (0.92 - t * 0.42);
      ctx.shadowBlur = 6;
      ctx.strokeStyle = `rgba(127, 220, 176, ${0.65 + (1 - t) * 0.35})`;
      ctx.beginPath();
      ctx.moveTo(pts[i].x, pts[i].y);
      ctx.lineTo(pts[i - 1].x, pts[i - 1].y);
      ctx.stroke();
    }

    ctx.shadowBlur = 0;
    ctx.strokeStyle = COLOR_OUTLINE;
    ctx.lineWidth = Math.max(2, CELL * 0.1);
    ctx.beginPath();
    ctx.moveTo(pts[n - 1].x, pts[n - 1].y);
    for (let i = n - 2; i >= 0; i--) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.stroke();

    drawHead(pts[0]);
  }

  function drawHead(center) {
    const fx = dir.x, fy = dir.y;
    const px = -dir.y, py = dir.x;
    const r = CELL * 0.5;

    ctx.save();
    ctx.shadowColor = COLOR_BODY;
    ctx.shadowBlur = 14;
    ctx.fillStyle = COLOR_HEAD_BRIGHT;
    ctx.beginPath();
    ctx.ellipse(center.x, center.y, r * 0.62, r * 0.62, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    const eyeForward = r * 0.32;
    const eyeSide = r * 0.4;
    [-1, 1].forEach(side => {
      const ex = center.x + fx * eyeForward + px * eyeSide * side;
      const ey = center.y + fy * eyeForward + py * eyeSide * side;
      ctx.fillStyle = COLOR_INK;
      ctx.beginPath();
      ctx.arc(ex, ey, CELL * 0.1, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(ex + fx * CELL * 0.03, ey + fy * CELL * 0.03, CELL * 0.03, 0, Math.PI * 2);
      ctx.fill();
    });

    const mouthTip = { x: center.x + fx * r * 0.85, y: center.y + fy * r * 0.85 };
    const mouthBack = { x: center.x + fx * r * 0.35, y: center.y + fy * r * 0.35 };
    ctx.strokeStyle = COLOR_INK;
    ctx.lineWidth = Math.max(1.5, CELL * 0.05);
    ctx.beginPath();
    ctx.moveTo(mouthBack.x - px * r * 0.18, mouthBack.y - py * r * 0.18);
    ctx.lineTo(mouthTip.x, mouthTip.y);
    ctx.lineTo(mouthBack.x + px * r * 0.18, mouthBack.y + py * r * 0.18);
    ctx.stroke();

    const flickOn = !REDUCE_MOTION && running && !paused && (performance.now() % 1400) < 260;
    if (flickOn) {
      const tongueBase = { x: center.x + fx * r * 0.95, y: center.y + fy * r * 0.95 };
      const tongueLen = CELL * 0.55;
      const tongueTip = { x: tongueBase.x + fx * tongueLen, y: tongueBase.y + fy * tongueLen };
      const forkSpread = CELL * 0.12;
      ctx.strokeStyle = COLOR_DANGER;
      ctx.lineWidth = Math.max(1, CELL * 0.035);
      ctx.beginPath();
      ctx.moveTo(tongueBase.x, tongueBase.y);
      ctx.lineTo(tongueTip.x, tongueTip.y);
      ctx.moveTo(tongueTip.x, tongueTip.y);
      ctx.lineTo(tongueTip.x + fx * CELL * 0.14 - px * forkSpread, tongueTip.y + fy * CELL * 0.14 - py * forkSpread);
      ctx.moveTo(tongueTip.x, tongueTip.y);
      ctx.lineTo(tongueTip.x + fx * CELL * 0.14 + px * forkSpread, tongueTip.y + fy * CELL * 0.14 + py * forkSpread);
      ctx.stroke();
    }
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = COLOR_GRID;
    ctx.lineWidth = 1;
    for (let i = 1; i < GRID; i++) {
      ctx.beginPath();
      ctx.moveTo(i * CELL, 0);
      ctx.lineTo(i * CELL, canvas.height);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, i * CELL);
      ctx.lineTo(canvas.width, i * CELL);
      ctx.stroke();
    }

    const foodPulse = 0.5 + 0.5 * Math.sin(performance.now() / 150);
    ctx.save();
    ctx.shadowColor = COLOR_FOOD;
    ctx.shadowBlur = 10 + foodPulse * 8;
    ctx.fillStyle = COLOR_FOOD;
    ctx.beginPath();
    ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL / 2 - 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    drawSnake();
    ctx.shadowBlur = 0;

    particles.forEach(p => {
      ctx.globalAlpha = Math.max(p.life, 0);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
  }

  function loop(now) {
    if (!running || paused) return;
    if (now - lastTick >= interval) {
      step();
      lastTick = now;
      if (gameOver) return;
    }
    draw();
    requestAnimationFrame(loop);
  }

  reset();
  draw();
})();
</script>
</body>
</html>
